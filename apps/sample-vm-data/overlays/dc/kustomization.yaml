apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: patch-state.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: sample-vm-data-cloudinit
    behavior: replace
    files:
      - userdata=cloud-init.yaml
labels:
  - pairs:
      site: dc
    includeSelectors: false
