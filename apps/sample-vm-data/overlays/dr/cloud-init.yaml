#cloud-config
# VM demo data stateful: disk data (/data) berisi heartbeat.log. Tiap 10 detik ditulis satu baris
# berisi waktu dan nama site. Halaman web menampilkan 15 baris terakhir dan marker SITE=<DC|DR>.
# Untuk akses login, tambahkan ssh_authorized_keys milik Anda:
# ssh_authorized_keys:
#   - ssh-ed25519 AAAA... user@host
write_files:
  - path: /etc/site
    content: "DR\n"
  - path: /usr/local/bin/setup-data.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -e
      DEV=/dev/disk/by-id/virtio-datadisk
      for i in $(seq 1 60); do [ -b "$DEV" ] && break; sleep 1; done
      [ -b "$DEV" ] || { echo "data disk tidak ditemukan"; exit 1; }
      # Format HANYA jika disk belum punya filesystem (hasil restore tidak diformat ulang)
      if ! blkid "$DEV" >/dev/null 2>&1; then
        mkfs.ext4 -F -L vmdata "$DEV"
      fi
      mkdir -p /data
      mountpoint -q /data || mount "$DEV" /data
  - path: /usr/local/bin/heartbeat.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      while true; do
        echo "$(date -Is) site=$(cat /etc/site) vm=$(hostname)" >> /data/heartbeat.log
        sync
        sleep 10
      done
  - path: /opt/site/server.py
    permissions: "0755"
    content: |
      #!/usr/bin/env python3
      import html
      import http.server

      SITE = open("/etc/site").read().strip()
      LOG = "/data/heartbeat.log"

      class Handler(http.server.BaseHTTPRequestHandler):
          def do_GET(self):
              try:
                  lines = open(LOG).read().splitlines()
              except Exception:
                  lines = []
              body = (
                  "<!-- SITE=%s -->\n<html><body style='font-family:monospace'>"
                  "<h1>sample-vm-data</h1><h2>SITE: %s</h2>"
                  "<p>baris heartbeat di disk data: %d</p><pre>%s</pre></body></html>"
                  % (SITE, SITE, len(lines), html.escape("\n".join(lines[-15:])))
              ).encode()
              self.send_response(200)
              self.send_header("Content-Type", "text/html")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def log_message(self, *args):
              pass

      http.server.HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
  - path: /etc/systemd/system/data-disk.service
    content: |
      [Unit]
      Description=Siapkan disk data
      After=local-fs.target
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/bin/setup-data.sh
      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/heartbeat.service
    content: |
      [Unit]
      Description=Heartbeat ke disk data
      Requires=data-disk.service
      After=data-disk.service
      [Service]
      ExecStart=/usr/local/bin/heartbeat.sh
      Restart=always
      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/data-web.service
    content: |
      [Unit]
      Description=Web demo data
      Requires=data-disk.service
      After=data-disk.service
      [Service]
      ExecStart=/usr/bin/python3 /opt/site/server.py
      Restart=always
      [Install]
      WantedBy=multi-user.target
runcmd:
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, data-disk.service]
  - [systemctl, enable, --now, heartbeat.service]
  - [systemctl, enable, --now, data-web.service]
  - "systemctl enable --now qemu-guest-agent || true"
