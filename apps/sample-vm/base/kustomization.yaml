apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-vm
resources:
  - namespace.yaml
  - vm.yaml
  - service.yaml
  - route.yaml
  - route-global.yaml
# Nama secret dibuat tetap (tanpa hash) karena direferensikan oleh field CRD KubeVirt
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: sample-vm-cloudinit
    files:
      - userdata=cloud-init.yaml
labels:
  - pairs:
      app.kubernetes.io/name: sample-vm
      app.kubernetes.io/part-of: dc-dr-gitops-poc
    includeSelectors: false
