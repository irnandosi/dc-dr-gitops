# Route global: hostname sama di DC dan DR; DNS/GSLB menentukan site aktif.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sample-vm-global
spec:
  host: sample-vm.example.com
  to:
    kind: Service
    name: sample-vm
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
