apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: sample-vm
spec:
  # runStrategy efektif per-site diatur di overlays/*/patch-state.yaml (Always / Halted)
  runStrategy: Always
  template:
    metadata:
      labels:
        app: sample-vm
    spec:
      domain:
        cpu:
          cores: 1
        memory:
          guest: 2Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 30
      volumes:
        # Varian sederhana: containerDisk (efemeral, tanpa storage class).
        # Untuk disk persisten lihat variants/datavolume.
        - name: rootdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:latest   # mirror ke registry internal bila disconnected
        - name: cloudinit
          cloudInitNoCloud:
            secretRef:
              name: sample-vm-cloudinit
