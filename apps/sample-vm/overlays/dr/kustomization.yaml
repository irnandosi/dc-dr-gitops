apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# Aktifkan disk persisten (DataVolume) dengan menghapus tanda komentar di bawah:
# components:
#   - ../../variants/datavolume
patches:
  - path: patch-state.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: sample-vm-cloudinit
    behavior: replace
    files:
      - userdata=cloud-init.yaml
labels:
  - pairs:
      site: dr
    includeSelectors: false
