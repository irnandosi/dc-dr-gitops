apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - datavolume.yaml
patches:
  - target:
      kind: VirtualMachine
      name: sample-vm
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: rootdisk
          dataVolume:
            name: sample-vm-rootdisk
