apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-web
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - route-global.yaml
configMapGenerator:
  - name: sample-web-content
    files:
      - index.html
labels:
  - pairs:
      app.kubernetes.io/name: sample-web
      app.kubernetes.io/part-of: dc-dr-gitops-poc
    includeSelectors: false
