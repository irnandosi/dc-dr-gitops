# Route "global": hostname SAMA di DC dan DR. DNS/GSLB yang menentukan traffic ke site mana.
# Ganti host lewat scripts/set-placeholders.sh. Pastikan sertifikat TLS mencakup hostname ini.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sample-web-global
spec:
  host: web.poc.imid.local
  to:
    kind: Service
    name: sample-web
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
