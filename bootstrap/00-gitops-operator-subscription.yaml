# Apply di CLUSTER DC dan CLUSTER DR (sekali saja).
# Cek channel yang tersedia: oc get packagemanifest openshift-gitops-operator -n openshift-marketplace -o jsonpath='{.status.channels[*].name}'
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-gitops-operator
  namespace: openshift-operators
spec:
  channel: latest
  installPlanApproval: Automatic
  name: openshift-gitops-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
