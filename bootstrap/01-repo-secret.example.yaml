# CONTOH credential repo private untuk Argo CD. JANGAN commit nilai asli ke Git.
# Isi nilai, lalu: oc apply -f 01-repo-secret.example.yaml  (di DC dan DR)
apiVersion: v1
kind: Secret
metadata:
  name: repo-dc-dr-gitops
  namespace: openshift-gitops
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/irnandosi/dc-dr-gitops.git
  username: CHANGE_ME
  password: CHANGE_ME_TOKEN
  # Jika Git server memakai CA internal, daftarkan CA di ConfigMap argocd-tls-certs-cm
  # atau (hanya untuk POC) tambahkan:  insecure: "true"
