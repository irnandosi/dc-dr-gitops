apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-vm-dc
  namespace: openshift-gitops
  labels:
    site: dc
spec:
  project: default
  source:
    repoURL: https://github.com/irnandosi/dc-dr-gitops.git
    targetRevision: main
    path: apps/sample-vm/overlays/dc
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-vm
  syncPolicy:
    automated:
      selfHeal: true   # drift manual dikembalikan ke kondisi Git
      prune: true
    syncOptions:
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
