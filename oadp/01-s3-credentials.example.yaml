# CONTOH. Isi access key & secret key S3 Anda, apply di KEDUA cluster. JANGAN commit nilai asli ke Git.
# Format file kredensial mengikuti format AWS (profile "default").
apiVersion: v1
kind: Secret
metadata:
  name: cloud-credentials
  namespace: openshift-adp
type: Opaque
stringData:
  cloud: |
    [default]
    aws_access_key_id=CHANGE_ME_ACCESS_KEY
    aws_secret_access_key=CHANGE_ME_SECRET_KEY
