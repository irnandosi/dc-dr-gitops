# Backup berkala data VM dari site DC. Apply di cluster DC.
# Nama backup: data-dc-<timestamp>. RPO kasar = interval schedule (di sini 15 menit).
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: data-dc
  namespace: openshift-adp
spec:
  schedule: "*/15 * * * *"
  template:
    includedNamespaces:
      - sample-vm-data
    snapshotMoveData: true
    storageLocation: dc-site
    ttl: 72h0m0s
